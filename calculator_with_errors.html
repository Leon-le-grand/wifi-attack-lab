<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .calculator { width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 48%; padding: 10px; margin-right: 2%; cursor: pointer; }
        button:last-child { margin-right: 0; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Simple Calculator</h2>
    <input type="text" id="num1" placeholder="Enter first number">
    <input type="text" id="num2" placeholder="Enter second number">
    <button onclick="calculateResult()">Add</button>
    <p>Result: <span id="result"></span></p>
</div>

<script>
    function calculateResult() {
        const number1 = document.getElementById('num1').value;
        const number2 = document.getElementById('num2').value;

        const sum = parseInt(number1) + parseInt(number2);
        document.getElementById('result').innerText = sum;
    }
</script>

</body>
</html>
